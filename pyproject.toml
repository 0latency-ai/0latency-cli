[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "0latency-cli"
version = "0.1.0"
description = "Verbatim CLI capture wrapper for Claude Code, Codex, Gemini CLI, Aider"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "0Latency AI", email = "hello@0latency.ai"}
]
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
    "platformdirs>=4.0.0"
]

[project.scripts]
0latency = "zerolatency_cli.__main__:main"

[project.urls]
Homepage = "https://github.com/0latency-ai/0latency-cli"
Repository = "https://github.com/0latency-ai/0latency-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/zerolatency_cli"]
